<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anekdot.io - Admin Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Tema gelap/profesional untuk membedakan dengan halaman siswa */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Garis aksen di atas kartu */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #3b82f6; /* Warna biru profesional */
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            background: #eff6ff;
            color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
        }

        h1 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Styling Khusus Captcha */
        .captcha-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        #captchaCanvas {
            border-radius: 5px;
            cursor: not-allowed;
            background: #fff;
            border: 1px solid #cbd5e1;
        }

        .btn-refresh {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-refresh:hover {
            background: #cbd5e1;
            color: #1e293b;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #2563eb;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="admin-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        
        <h1>Verifikasi Akses Admin</h1>
        <p class="subtitle">Sistem Keamanan Teks Anekdot Terenkripsi</p>

        <form id="adminLoginForm">
            <!-- Input Nama Lengkap -->
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="namaLengkap" placeholder="Nama Lengkap" required autocomplete="off">
            </div>
            
            <!-- Input NPM -->
            <div class="input-group">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="npm" placeholder="NPM Mahasiswa" required autocomplete="off">
            </div>

            <!-- Area Captcha -->
            <div class="captcha-container">
                <canvas id="captchaCanvas" width="160" height="45" title="Kode Verifikasi"></canvas>
                <button type="button" class="btn-refresh" id="refreshCaptcha" title="Muat Ulang Captcha">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Input Jawaban Captcha -->
            <div class="input-group">
                <i class="fa-solid fa-shield-halved"></i>
                <input type="text" id="captchaInput" placeholder="Masukkan Kode Verifikasi di atas" required autocomplete="off" maxlength="6">
            </div>

            <div class="error-msg" id="errorMsg">Nama, NPM, atau Kode Verifikasi salah!</div>

            <button type="submit" class="btn-submit">
                Verifikasi & Masuk <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Halaman Utama</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cek jika admin sudah login sebelumnya, langsung arahkan ke dashboard
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }

            const loginForm = document.getElementById('adminLoginForm');
            const errorMsg = document.getElementById('errorMsg');
            const captchaCanvas = document.getElementById('captchaCanvas');
            const refreshCaptchaBtn = document.getElementById('refreshCaptcha');
            
            let currentCaptchaCode = '';

            // Fungsi untuk membuat gambar Captcha
            function generateCaptcha() {
                const ctx = captchaCanvas.getContext('2d');
                ctx.clearRect(0, 0, captchaCanvas.width, captchaCanvas.height);

                // Background putih-abu
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, captchaCanvas.width, captchaCanvas.height);

                // Karakter yang diizinkan (dihindari huruf yang mirip seperti O dan 0, I dan l)
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                currentCaptchaCode = '';
                for (let i = 0; i < 5; i++) {
                    currentCaptchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }

                // Tambahkan Garis Noise (Gangguan)
                for(let i = 0; i < 6; i++) {
                    ctx.strokeStyle = ['#cbd5e1', '#94a3b8', '#64748b'][Math.floor(Math.random()*3)];
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                    ctx.lineTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                    ctx.stroke();
                }

                // Tulis Teks Captcha
                ctx.font = 'bold 26px Poppins, sans-serif';
                ctx.fillStyle = '#1e293b';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Sedikit trik agar tulisan tidak terlalu lurus
                ctx.setTransform(1, Math.random()*0.1 - 0.05, Math.random()*0.1 - 0.05, 1, 0, 0);
                ctx.fillText(currentCaptchaCode, captchaCanvas.width / 2, captchaCanvas.height / 2 + 2);
                ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform

                // Tambahkan Titik Noise
                for(let i = 0; i < 40; i++) {
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height, 1, 0, 2*Math.PI);
                    ctx.fill();
                }
            }

            // Generate Captcha pertama kali halaman dimuat
            generateCaptcha();

            // Generate ulang saat tombol refresh ditekan
            refreshCaptchaBtn.addEventListener('click', generateCaptcha);

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const namaVal = document.getElementById('namaLengkap').value.trim();
                const npmVal = document.getElementById('npm').value.trim();
                const captchaVal = document.getElementById('captchaInput').value.trim().toUpperCase();

                // -----------------------------------------------------------------
                // DAFTAR KREDENSIAL LOGIN ADMIN (Gunakan Array agar bisa banyak)
                // -----------------------------------------------------------------
                const daftarAdmin = [
                    { nama: "Bayu", npm: "2410301004" },
                    { nama: "Devana", npm: "2430301151" }
                ];
                // -----------------------------------------------------------------

                // Validasi Captcha Terlebih Dahulu
                if (captchaVal !== currentCaptchaCode) {
                    showError("Kode verifikasi (Captcha) salah!");
                    document.getElementById('captchaInput').value = '';
                    generateCaptcha(); // Refresh captcha jika salah
                    return;
                }

                // Validasi Nama dan NPM (Mengecek apakah input cocok dengan salah satu di daftarAdmin)
                const isAdminValid = daftarAdmin.some(admin => 
                    admin.nama.toLowerCase() === namaVal.toLowerCase() && admin.npm === npmVal
                );

                if (isAdminValid) {
                    errorMsg.style.display = 'none';
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    showError("Nama Lengkap atau NPM tidak terdaftar sebagai Admin!");
                    document.getElementById('captchaInput').value = '';
                    generateCaptcha(); // Refresh captcha untuk keamanan tambahan
                }
            });

            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.style.display = 'block';
                
                // Animasi getar sedikit
                const card = document.querySelector('.login-card');
                card.style.transform = 'translateX(-10px)';
                setTimeout(() => card.style.transform = 'translateX(10px)', 100);
                setTimeout(() => card.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => card.style.transform = 'translateX(0)', 300);
            }
        });
    </script>
</body>
</html>
